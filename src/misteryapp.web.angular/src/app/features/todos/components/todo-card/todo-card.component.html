<div class="card" [class.card--completed]="todo().completed">
  <div class="card__check">
    <button
      class="card__checkbox"
      [class.card__checkbox--checked]="todo().completed"
      (click)="handleToggle()"
      [attr.aria-label]="todo().completed ? 'Mark as incomplete' : 'Mark as complete'"
      [attr.aria-pressed]="todo().completed"
    >
      @if (todo().completed) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20,6 9,17 4,12" />
        </svg>
      }
    </button>
  </div>

  <div class="card__content">
    <div class="card__header">
      <span class="card__title" [class.card__title--done]="todo().completed">
        {{ todo().title }}
      </span>
      <app-priority-badge [priority]="todo().priority" />
    </div>

    @if (todo().description) {
      <p class="card__description">{{ todo().description }}</p>
    }

    <div class="card__footer">
      <span class="card__date">
        {{ todo().createdAt | date: 'MMM d, y' }}
      </span>
      <div class="card__actions">
        <button
          class="card__action"
          (click)="handleEdit()"
          aria-label="Edit todo"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button
          class="card__action card__action--danger"
          (click)="handleDelete()"
          aria-label="Delete todo"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3,6 5,6 21,6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
