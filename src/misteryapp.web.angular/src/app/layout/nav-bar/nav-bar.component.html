<nav class="nav" role="navigation" aria-label="Main navigation">
  <div class="nav__inner">
    <a class="nav__brand" routerLink="/todos">
      <span class="nav__logo">✦</span>
      <span class="nav__title">MisteryApp</span>
    </a>

    <div class="nav__links">
      <a
        class="nav__link"
        routerLink="/todos"
        routerLinkActive="nav__link--active"
      >
        Todos
      </a>
      <a
        class="nav__link"
        routerLink="/profile"
        routerLinkActive="nav__link--active"
      >
        Profile
      </a>
    </div>

    <div class="nav__actions">
      <div
        class="nav__avatar"
        [style.background-color]="authState.session()?.avatarColor"
        aria-hidden="true"
        title="{{ authState.session()?.name }}"
      >
        {{ userInitial }}
      </div>
      <button class="nav__logout" (click)="logout()" aria-label="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</nav>
