<div class="login">
  <div class="login__card">
    <h2 class="login__title">Welcome</h2>
    <p class="login__subtitle">Enter your details to get started</p>

    <form class="login__form" (ngSubmit)="onSubmit()">
      <div class="login__field">
        <label class="login__label" for="username">Username</label>
        <input
          class="login__input"
          id="username"
          type="text"
          placeholder="e.g. john_doe"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          autocomplete="username"
        />
      </div>

      <div class="login__field">
        <label class="login__label" for="displayName">Display Name</label>
        <input
          class="login__input"
          id="displayName"
          type="text"
          placeholder="e.g. John Doe"
          [ngModel]="displayName()"
          (ngModelChange)="displayName.set($event)"
          name="displayName"
          autocomplete="name"
        />
      </div>

      @if (error()) {
        <p class="login__error">{{ error() }}</p>
      }

      <button
        class="login__button"
        type="submit"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          Signing in...
        } @else {
          Sign In
        }
      </button>
    </form>
  </div>
</div>
